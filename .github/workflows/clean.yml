name: 清理仓库 Actions Releases Tags

on:
  schedule:
    # 每 15 天触发一次
    - cron: '0 0 */15 * *'
  workflow_dispatch:
    inputs:
      force_trigger:
        description: '打勾以确认强制立即清理'
        required: true
        type: boolean
        default: true

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:

      - name: 删除所有 Actions 运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            console.log(`发现 ${runs.length} 个 Actions 运行记录`);

            for (const run of runs) {
              // 跳过当前正在运行的 workflow
              if (run.id === context.runId) {
                console.log(`跳过当前运行: ${run.id}`);
                continue;
              }

              try {
                console.log(`删除 Actions: ${run.id}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              } catch (error) {
                console.log(`删除失败 ${run.id}: ${error.message}`);
              }
            }

      - name: 删除 Releases 和 Tags（保留最新 3 个）
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            console.log(`总共发现 ${releases.length} 个 Release`);

            // 截取数组，跳过最新的前 3 个，剩余的放入待删除列表
            const releasesToDelete = releases.slice(3);
            
            console.log(`将保留最新 3 个，准备删除其余 ${releasesToDelete.length} 个 Release`);

            for (const release of releasesToDelete) {
              try {
                console.log(`删除 Release: ${release.tag_name}`);

                // 删除 Release
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id
                });

                // 删除 Tag
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`
                  });
                  console.log(`删除 Tag: ${release.tag_name}`);
                } catch(e) {
                  console.log(`Tag 不存在: ${release.tag_name}`);
                }

              } catch(error) {
                console.log(`Release 删除失败 ${release.tag_name}: ${error.message}`);
              }
            }
