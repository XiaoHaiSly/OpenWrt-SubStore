name: 清理仓库所有 Actions 和 Releases

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 删除所有 Actions 运行记录
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            console.log(`找到 ${runs.length} 个 Actions 记录`);

            for (const run of runs) {
              console.log(`删除运行记录: ${run.id}`);

              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }

      - name: 删除所有 Releases 和 Tags
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            console.log(`找到 ${releases.length} 个 Release`);

            for (const release of releases) {

              console.log(`删除 Release: ${release.tag_name}`);

              // 删除 Release
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id
              });

              // 删除 Tag
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`
                });

                console.log(`删除 Tag: ${release.tag_name}`);

              } catch(e) {
                console.log(`Tag ${release.tag_name} 不存在`);
              }
            }
