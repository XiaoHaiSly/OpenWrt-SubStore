name: luci-app-substore-build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.ver.outputs.version }}
      pkg_version: ${{ steps.ver.outputs.pkg_version }}
      pkg_release: ${{ steps.ver.outputs.pkg_release }}
      backend_tag: ${{ steps.upstream.outputs.backend_tag }}
      frontend_tag: ${{ steps.upstream.outputs.frontend_tag }}
    steps:
      - name: Query upstream Sub-Store versions
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BACKEND_TAG=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/sub-store-org/Sub-Store/releases/latest | jq -r .tag_name)
          FRONTEND_TAG=$(curl -s -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/sub-store-org/Sub-Store-Front-End/releases/latest | jq -r .tag_name)
          echo "backend_tag=$BACKEND_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=$FRONTEND_TAG" >> "$GITHUB_OUTPUT"
          echo "后端上游最新: $BACKEND_TAG"
          echo "前端上游最新: $FRONTEND_TAG"

      - name: Resolve version
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE="$(date -u +%Y.%m.%d)"
          COUNT=$(gh release list --repo "${{ github.repository }}" --limit 200 --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"v${DATE}-r\"))] | length")
          R=$((COUNT + 1))
          VERSION="${DATE}-r${R}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg_version=$DATE" >> "$GITHUB_OUTPUT"
          echo "pkg_release=$R" >> "$GITHUB_OUTPUT"
          echo "本次构建版本号: $VERSION（当天第 $R 次构建）"

  build-ipk:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set package version
        run: |
          if [ -f src/luci-app-substore/Makefile ]; then
            sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ needs.prepare.outputs.pkg_version }}/g" src/luci-app-substore/Makefile
            sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=${{ needs.prepare.outputs.pkg_release }}/g" src/luci-app-substore/Makefile
            echo "Successfully updated PKG_VERSION/PKG_RELEASE"
            grep -E "PKG_VERSION:=|PKG_RELEASE:=" src/luci-app-substore/Makefile
          else
            echo "Warning: Makefile not found in src/ directory!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 zstd

      - name: Download OpenWrt SDK
        run: |
          wget -q "https://downloads.openwrt.org/releases/24.10.7/targets/x86/64/openwrt-sdk-24.10.7-x86-64_gcc-13.3.0_musl.Linux-x86_64.tar.zst" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Setup feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Copy package
        run: |
          cp -r src/luci-app-substore openwrt-sdk/package/luci-app-substore
          ls openwrt-sdk/package/luci-app-substore/

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt-sdk
          make defconfig
          if ! make package/luci-app-substore/compile V=s \
              SUBSTORE_BACKEND_TAG="${{ needs.prepare.outputs.backend_tag }}" \
              SUBSTORE_FRONTEND_TAG="${{ needs.prepare.outputs.frontend_tag }}" \
              > build.log 2>&1; then
            echo "=== 编译失败，日志最后 150 行 ==="
            tail -150 build.log
            exit 1
          fi
          tail -50 build.log

      - name: Collect IPK
        run: |
          mkdir -p output
          find openwrt-sdk/bin -name "luci-app-substore*.ipk" -exec cp {} output/ \;
          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-substore-ipk
          path: output/*.ipk

  build-apk:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: src

      - name: Set package version
        run: |
          if [ -f src/luci-app-substore/Makefile ]; then
            sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ needs.prepare.outputs.pkg_version }}/g" src/luci-app-substore/Makefile
            sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=${{ needs.prepare.outputs.pkg_release }}/g" src/luci-app-substore/Makefile
            echo "Successfully updated PKG_VERSION/PKG_RELEASE"
            grep -E "PKG_VERSION:=|PKG_RELEASE:=" src/luci-app-substore/Makefile
          else
            echo "Warning: Makefile not found in src/ directory!"
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3 zstd

      - name: Download OpenWrt SDK
        run: |
          wget -q "https://downloads.openwrt.org/releases/25.12.4/targets/x86/64/openwrt-sdk-25.12.4-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst" -O sdk.tar.zst
          tar --zstd -xf sdk.tar.zst
          mv openwrt-sdk-* openwrt-sdk

      - name: Setup feeds
        run: |
          cd openwrt-sdk
          ./scripts/feeds update luci
          ./scripts/feeds install -a -p luci

      - name: Copy package
        run: |
          cp -r src/luci-app-substore openwrt-sdk/package/luci-app-substore

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd openwrt-sdk
          make defconfig
          if ! make package/luci-app-substore/compile V=s \
              SUBSTORE_BACKEND_TAG="${{ needs.prepare.outputs.backend_tag }}" \
              SUBSTORE_FRONTEND_TAG="${{ needs.prepare.outputs.frontend_tag }}" \
              > build.log 2>&1; then
            echo "=== 编译失败，日志最后 150 行 ==="
            tail -150 build.log
            exit 1
          fi
          tail -80 build.log

      - name: Collect APK
        run: |
          mkdir -p output
          find openwrt-sdk/bin -name "luci-app-substore*.apk" -exec cp {} output/ \;
          for f in output/*.apk; do
            base="$(basename "$f" .apk)"
            case "$base" in
              *_all) ;;
              *) mv "$f" "output/${base}_all.apk" ;;
            esac
          done

          # 保持文件名为 _all，但修改 APK 内部架构为 noarch
          # OpenWrt 25.12 apk 使用 noarch 识别纯脚本包
          for f in output/*.apk; do
            if tar tf "$f" | grep -q ".PKGINFO"; then
              mkdir -p tmp-apk
              tar xf "$f" -C tmp-apk
              if grep -q "^arch = all" tmp-apk/.PKGINFO; then
                sed -i "s/^arch = all$/arch = noarch/" tmp-apk/.PKGINFO
                (cd tmp-apk && tar czf "../$(basename "$f").tmp" .)
                mv "$(dirname "$f")/$(basename "$f").tmp" "$f"
              fi
              rm -rf tmp-apk
            fi
          done

          ls -lh output/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-substore-apk
          path: output/*.apk

  release:
    needs: [prepare, build-ipk, build-apk]
    runs-on: ubuntu-22.04
    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-substore-ipk
          path: output

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: luci-app-substore-apk
          path: output

      - name: List files
        run: ls -lh output/

      - name: Compose release notes
        id: notes
        run: |
          BACKEND_TAG="${{ needs.prepare.outputs.backend_tag }}"
          FRONTEND_TAG="${{ needs.prepare.outputs.frontend_tag }}"
          [ -n "$BACKEND_TAG" ] || BACKEND_TAG="(查询失败)"
          [ -n "$FRONTEND_TAG" ] || FRONTEND_TAG="(查询失败)"
          {
            echo "body<<EOF"
            echo "**本次更新到的 Sub-Store 上游版本**"
            echo "- 后端 (Sub-Store): \`$BACKEND_TAG\`"
            echo "- 前端 (Sub-Store-Front-End): \`$FRONTEND_TAG\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: luci-app-substore v${{ needs.prepare.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            output/*.ipk
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-makefile:
    needs: [prepare, release]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update Makefile version
        run: |
          sed -i "s/PKG_VERSION:=.*/PKG_VERSION:=${{ needs.prepare.outputs.pkg_version }}/" luci-app-substore/Makefile
          sed -i "s/PKG_RELEASE:=.*/PKG_RELEASE:=${{ needs.prepare.outputs.pkg_release }}/" luci-app-substore/Makefile
          sed -i "s/SUBSTORE_BACKEND_TAG:=.*/SUBSTORE_BACKEND_TAG:=${{ needs.prepare.outputs.backend_tag }}/" luci-app-substore/Makefile
          sed -i "s/SUBSTORE_FRONTEND_TAG:=.*/SUBSTORE_FRONTEND_TAG:=${{ needs.prepare.outputs.frontend_tag }}/" luci-app-substore/Makefile
          grep -E "PKG_VERSION:=|PKG_RELEASE:=|SUBSTORE_BACKEND_TAG:=|SUBSTORE_FRONTEND_TAG:=" luci-app-substore/Makefile

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add luci-app-substore/Makefile
          if git diff --cached --quiet; then
            echo "Makefile 版本号没有变化，跳过提交"
          else
            git commit -m "chore: sync Makefile version to ${{ needs.prepare.outputs.version }} (backend ${{ needs.prepare.outputs.backend_tag }}, frontend ${{ needs.prepare.outputs.frontend_tag }})"
            git pull --rebase
            git push
          fi
